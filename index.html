<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梵谷作品 - Bootstrap 輪播與卡片</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* 1280px 以上：一排 6 個卡片（Bootstrap 沒有 1280 斷點，自訂媒體查詢，需放在 Bootstrap CSS 之後） */
    @media (min-width: 1280px) {
      .row-cols-1280-6 > * { flex: 0 0 auto; width: 16.66666667%; }
    }
    .carousel-item img { height: 460px; object-fit: cover; }
    .carousel-caption { background: rgba(0,0,0,.45); border-radius: .5rem; }
    .card-img-top { height: 200px; object-fit: cover; object-position: center top; background: #eee; }
    @media (max-width: 575.98px) {
      .carousel-item img { height: 240px; }
      .card-img-top { height: 240px; }
    }
  </style>
</head>
<body>

  <!-- 輪播圖（4 張，圖片來自 Wikimedia Commons，梵谷作品為公有領域） -->
  <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="第 1 張"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1" aria-label="第 2 張"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2" aria-label="第 3 張"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="3" aria-label="第 4 張"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg?width=1600" class="d-block w-100" alt="星夜">
        <div class="carousel-caption d-none d-md-block"><h5>星夜</h5><p>1889</p></div>
      </div>
      <div class="carousel-item">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Starry_Night_Over_the_Rhone.jpg?width=1600" class="d-block w-100" alt="隆河上的星夜">
        <div class="carousel-caption d-none d-md-block"><h5>隆河上的星夜</h5><p>1888</p></div>
      </div>
      <div class="carousel-item">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_van_Gogh_-_Poppy_field_-_Google_Art_Project.jpg?width=1600" class="d-block w-100" alt="罌粟花田">
        <div class="carousel-caption d-none d-md-block"><h5>罌粟花田</h5></div>
      </div>
      <div class="carousel-item">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent_Van_Gogh_-_Corn_Harvest_in_Provence_-_Google_Art_Project.jpg?width=1600" class="d-block w-100" alt="普羅旺斯的收割">
        <div class="carousel-caption d-none d-md-block"><h5>普羅旺斯的收割</h5></div>
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span><span class="visually-hidden">上一張</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span><span class="visually-hidden">下一張</span>
    </button>
  </div>

  <!-- 卡片區（12 張） -->
  <main class="container-fluid py-4 px-3 px-lg-4">
    <div id="cardRow" class="row g-3 row-cols-1 row-cols-sm-2 row-cols-md-4 row-cols-1280-6"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 圖片網址集中在這裡，要換圖只需修改此陣列（file 為 Wikimedia Commons 檔名）
    const paintings = [
      { title: '鳶尾花',         file: 'Irises-Vincent_van_Gogh.jpg' },
      { title: '阿爾勒的臥室',   file: 'Vincent_van_Gogh_-_De_slaapkamer_-_Google_Art_Project.jpg' },
      { title: '向日葵',         file: 'Vincent_van_Gogh_-_Sunflowers_-_VGM_F458.jpg' },
      { title: '盛開的杏花',     file: 'Vincent_van_Gogh_-_Almond_blossom_-_Google_Art_Project.jpg' },
      { title: '阿爾勒的花園',   file: 'Vincent_van_Gogh_-_Garden_at_Arles_-_Google_Art_Project.jpg' },
      { title: '橄欖園',         file: 'Vincent_van_Gogh_-_Olive_Orchard_-_Google_Art_Project.jpg' },
      { title: '嘉舍醫生肖像',   file: 'Vincent_van_Gogh_-_Dr_Paul_Gachet_-_Google_Art_Project.jpg' },
      { title: '自畫像',         file: 'Vincent_van_Gogh_-_Self-Portrait_-_Google_Art_Project_(454045).jpg' },
      { title: '吃馬鈴薯的人',   file: 'Vincent_van_Gogh_-_The_potato_eaters_-_Google_Art_Project.jpg' },
      { title: '粉紅色的果園',   file: 'Vincent_van_Gogh_-_De_roze_boomgaard_-_Google_Art_Project.jpg' },
      { title: '收穫',           file: 'Vincent_van_Gogh_-_De_oogst_-_Google_Art_Project.jpg' },
      { title: '高更的椅子',     file: 'Vincent_van_Gogh_-_De_stoel_van_Gauguin_-_Google_Art_Project.jpg' }
    ];
    const base = 'https://commons.wikimedia.org/wiki/Special:FilePath/';
    const row = document.getElementById('cardRow');
    paintings.forEach(p => {
      row.insertAdjacentHTML('beforeend', `
        <div class="col">
          <div class="card h-100">
            <img src="${base}${encodeURIComponent(p.file)}?width=600" class="card-img-top" alt="${p.title}" loading="lazy">
            <div class="card-body">
              <h5 class="card-title">${p.title}</h5>
              <p class="card-text">文森·梵谷（Vincent van Gogh）作品。</p>
            </div>
          </div>
        </div>`);
    });
  </script>
</body>
</html>
